name: Run Tests and Generate Coverage Report # 工作流名称，反映其目的

on:
  push:
    branches:
      - lwq # 当代码推送到 lwq 分支时触发此工作流

env:
  PYTHON_VERSION: '3.9' # 可以根据您的项目需求调整 Python 版本

jobs:
  test_coverage: # 作业名称，反映其目的
    runs-on: ubuntu-latest # 在 Ubuntu 系统的最新版本上运行
    environment: MGDB    # 如果您的测试需要访问 MGDB 环境中的 secrets 或 variables，请保留此行
                      # 如果不需要，您可以删除此行。

    steps:
    - name: Checkout code # 步骤1: 检出仓库代码
      uses: actions/checkout@v4

    - name: Set up Python ${{ env.PYTHON_VERSION }} # 步骤2: 设置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies (pytest, coverage, and project deps) # 步骤3: 安装所有依赖
      run: |
        python -m pip install --upgrade pip
        # 安装您的项目依赖 (requirements.txt 在 bookstore_MGDB 文件夹下)
        pip install -r bookstore_MGDB/requirements.txt
        # 安装测试和覆盖率工具
        pip install pytest coverage
      working-directory: ${{ github.workspace }} # 确保从仓库根目录执行，以便正确找到 bookstore_MGDB/requirements.txt

    - name: Run Tests with Coverage # 步骤4: 运行测试并生成覆盖率报告
      run: |
        # 切换到项目主目录 (bookstore_MGDB)，因为 fe, be 模块和测试可能都在其下
        cd bookstore_MGDB

        # 设置 PYTHONPATH，确保 fe 和 be 模块可以被 pytest 和 coverage 找到
        # 假设 fe 和 be 目录直接位于 bookstore_MGDB 之下
        export PYTHONPATH=$(pwd):$PYTHONPATH

        # 运行 coverage 和 pytest 命令
        coverage run --timid --branch --source fe,be --concurrency=thread -m pytest -v --ignore=fe/data
        coverage combine
        coverage report
        coverage html
      working-directory: ${{ github.workspace }} # 确保 `cd bookstore_MGDB` 从仓库根目录开始执行

    - name: Upload coverage report (Optional) # 步骤5: 上传生成的 HTML 覆盖率报告
      uses: actions/upload-artifact@v4
      with:
        name: coverage-html-report # 上传的 artifact 名称
        path: bookstore_MGDB/htmlcov/ # `coverage html` 会在当前目录下生成 htmlcov 文件夹
                                   # 因为上一步我们 cd 到了 bookstore_MGDB，所以 htmlcov 也在那里。
