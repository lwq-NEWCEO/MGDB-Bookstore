name: Run Tests and Generate Coverage Report # 工作流名称，反映其目的

on:
  push:
    branches:
      - lwq # 当代码推送到 lwq 分支时触发此工作流

env:
  PYTHON_VERSION: '3.9' # 可以根据您的项目需求调整 Python 版本

jobs:
  test_coverage: # 作业名称，反映其目的
    runs-on: ubuntu-latest # 在 Ubuntu 系统的最新版本上运行
    environment: MGDB    # 如果您的测试需要访问 MGDB 环境中的 secrets 或 variables，请保留此行
                      # 如果不需要，您可以删除此行。

    # --- 配置 MongoDB 服务 ---
    services:
      mongodb:
        image: mongo:4.4 # 使用 MongoDB 4.4 版本，您可以根据您的项目需求调整版本
        ports:
          - 27017:27017 # 将容器的 27017 端口映射到主机的 27017 端口

    steps:
    - name: Checkout code # 步骤1: 检出仓库代码
      uses: actions/checkout@v4

    - name: Set up Python ${{ env.PYTHON_VERSION }} # 步骤2: 设置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies (pytest, coverage, pymongo, and project deps) # 步骤3: 安装所有依赖
      run: |
        python -m pip install --upgrade pip
        # 安装您的项目依赖 (requirements.txt 在当前工作目录 bookstore_MGDB 下)
        pip install -r requirements.txt # 注意：这里路径已简化，因为工作目录已改变
        # 安装测试和覆盖率工具，并确保安装 pymongo
        pip install pytest coverage pymongo
      working-directory: bookstore_MGDB # <-- 重要修改：将工作目录设置为 bookstore_MGDB

    - name: Wait for MongoDB to start
      run: |
        echo "Waiting for MongoDB to become ready on localhost:27017..."
        for i in $(seq 1 20); do
          nc -zv localhost 27017 && echo "MongoDB is ready!" && break
          echo "MongoDB not ready yet, retrying in 1 second... (Attempt $i/20)"
          sleep 1
        done
        nc -zv localhost 27017 || (echo "Error: MongoDB failed to start or respond after multiple retries." && exit 1)
      working-directory: bookstore_MGDB # <-- 重要修改：保持工作目录一致

    - name: Run Tests with Coverage # 步骤4: 运行测试并生成覆盖率报告
      run: |
        # 因为 working-directory 已经设置为 bookstore_MGDB，所以无需再 cd
        # 设置 PYTHONPATH，确保 fe 和 be 模块可以被 pytest 和 coverage 找到
        # $(pwd) 现在是 /home/runner/work/MGDB-Bookstore/MGDB-Bookstore/bookstore_MGDB
        export PYTHONPATH=$(pwd):$PYTHONPATH

        # 运行 coverage 和 pytest 命令
        # pytest 命令现在是相对于 bookstore_MGDB 目录执行的
        coverage run --timid --branch --source fe,be --concurrency=thread -m pytest -v --ignore=fe/data
        coverage combine
        coverage report
        coverage html
      working-directory: bookstore_MGDB # <-- 重要修改：将工作目录设置为 bookstore_MGDB

    - name: Upload coverage report (Optional) # 步骤5: 上传生成的 HTML 覆盖率报告
      uses: actions/upload-artifact@v4
      with:
        name: coverage-html-report # 上传的 artifact 名称
        # path 现在是相对于 github.workspace，所以需要包含 bookstore_MGDB
        path: bookstore_MGDB/htmlcov/
      # 此步骤通常在 ${{ github.workspace }} 根目录执行，所以 path 保持原样即可```

### 关键修改解释：

1.  **`working-directory: bookstore_MGDB`：**
    *   在 `Install dependencies`、`Wait for MongoDB to start` 和 `Run Tests with Coverage` 这三个关键步骤中，我将 `working-directory` 属性直接设置为 `bookstore_MGDB`。
    *   这意味着这些步骤中的所有 `run` 命令都将**自动在 `/home/runner/work/MGDB-Bookstore/MGDB-Bookstore/bookstore_MGDB/` 目录下执行**。
    *   因此，`Install dependencies` 中的 `pip install -r requirements.txt` 可以直接找到 `requirements.txt`（因为它在 `bookstore_MGDB` 下）。
    *   `Run Tests with Coverage` 中不再需要 `cd bookstore_MGDB` 命令。
    *   `export PYTHONPATH=$(pwd):$PYTHONPATH` 中的 `$(pwd)` 现在就是 `bookstore_MGDB` 目录的完整路径。
    *   `--source fe,be` 和 `--ignore=fe/data` 也能正确引用 `bookstore_MGDB` 内部的 `fe` 和 `be` 目录。

2.  **`Upload coverage report` 步骤：**
    *   `path: bookstore_MGDB/htmlcov/` 保持不变，因为 `actions/upload-artifact` 默认从 `github.workspace` 根目录查找路径，而 `htmlcov` 是在 `bookstore_MGDB` 内部生成的。

### 如何应用这些修改：

1.  **更新工作流文件：** 将上述修改后的 YAML 代码复制并粘贴到您的仓库中 `.github/workflows/test_and_coverage.yml` 文件中，覆盖原有内容。
2.  **提交并推送更改：**
    ```bash
    git add .github/workflows/test_and_coverage.yml
    git commit -m "fix: Resolve ImportPathMismatchError by unifying working directory"
    git push origin lwq
    ```
3.  **检查 GitHub Actions 运行：** 推送后，GitHub Actions 会自动触发新的工作流运行。进入 GitHub 仓库的 "Actions" 选项卡，查看此次运行的详细日志。

通过这些修改，Pytest 应该能够在一个明确且一致的工作目录中运行，从而解决 `ImportPathMismatchError`。
