name: Deploy to MGDB Environment

on:
  push:
    branches:
      - lwq # 当代码推送到 lwq 分支时触发此工作流

env:
  PYTHON_VERSION: '3.9' # 可以根据您的项目需求调整 Python 版本

jobs:
  deploy:
    runs-on: ubuntu-latest # 在 Ubuntu 系统的最新版本上运行
    environment: MGDB    # 指定此作业在 MGDB 环境中运行

    steps:
    - name: Checkout code # 步骤1: 检出仓库代码
      uses: actions/checkout@v4

    - name: Set up Python ${{ env.PYTHON_VERSION }} # 步骤2: 设置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies # 步骤3: 安装项目依赖 (从 requirements.txt)
      run: |
        python -m pip install --upgrade pip
        pip install -r bookstore_MGDB/requirements.txt

    - name: Run my application (Example with Secrets and Variables) # 步骤4: 运行您的应用程序示例
      # 这一步将演示如何通过环境变量的形式，将 GitHub Environment secrets 和 variables 传递给您的应用程序。
      # 假设您已经在 MGDB 环境中设置了以下 secret 和 variable:
      # - Secret Name: DATABASE_URL (存储您的数据库连接字符串)
      # - Variable Name: DEBUG_MODE (存储如 'True' 或 'False' 的调试模式)
      run: |
        echo "Starting application..."
        # 这是一个示例命令，您需要替换为实际启动您应用程序的命令。
        # 例如，如果是 Django 应用，可能是 `python manage.py runserver 0.0.0.0:8000`
        # 或者是一个简单的 Python 脚本 `python app.py`
        python your_main_app_script.py # 请替换为您的主应用程序启动脚本
        echo "Application finished."
      env:
        # 将 GitHub Environment Secret 映射到作业的环境变量
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # 将 GitHub Environment Variable 映射到作业的环境变量
        DEBUG_MODE: ${{ vars.DEBUG_MODE }}
        # 您还可以添加其他普通的环境变量
        APP_NAME: MyBookstoreApp

    - name: Post-deployment checks (Optional) # 步骤5: 部署后检查 (可选)
      # 在这里可以添加一些部署后的验证步骤，例如运行测试、检查服务状态等。
      run: |
        echo "Performing post-deployment checks..."
        # curl http://localhost:8000/health # 示例：检查您的应用健康状况
        echo "Checks complete."
